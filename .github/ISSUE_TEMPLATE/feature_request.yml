name: Feature request
description: Suggest a capability or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow that is painful today, not the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: If this is a new tool or a new argument, sketch its inputs and outputs.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered

  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      description: >
        This server performs real deployments. Requests that make a destructive
        action easier to trigger accidentally are unlikely to be accepted.
      options:
        - label: This change does not make Production deployments, ForceSync, or filesystem access less explicit.
