name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (for example 1.0.1)'
        required: true
        type: string

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - name: Verify server.json matches the release version
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          declared=$(grep -m1 '"version"' .mcp/server.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          if [ "$declared" != "$version" ]; then
            echo "::error file=.mcp/server.json::server.json declares $declared but the release is $version"
            exit 1
          fi

      - name: Build
        run: dotnet build BusinessCentralDeploymentTool.slnx --configuration Release

      - name: Test
        run: dotnet test BusinessCentralDeploymentTool.slnx --configuration Release --no-build

  binaries:
    name: Publish ${{ matrix.rid }}
    runs-on: ubuntu-latest
    needs: verify

    strategy:
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish self-contained
        run: >
          dotnet publish BcDeployment.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output publish/${{ matrix.rid }}
          -p:PackAsTool=false
          -p:Version=${{ needs.verify.outputs.version }}
          -p:ContinuousIntegrationBuild=true

      - name: Archive
        run: |
          cd publish
          zip -r "../business-central-deployment-tool-${{ needs.verify.outputs.version }}-${{ matrix.rid }}.zip" "${{ matrix.rid }}"

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.rid }}
          path: '*.zip'

  publish:
    name: Publish to NuGet.org
    runs-on: ubuntu-latest
    needs: [verify, binaries]
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Pack
        run: >
          dotnet pack BcDeployment.csproj
          --configuration Release
          --output artifacts/nupkg
          -p:Version=${{ needs.verify.outputs.version }}
          -p:ContinuousIntegrationBuild=true

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: artifacts/binaries
          merge-multiple: true

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push package
        run: >
          dotnet nuget push artifacts/nupkg/*.nupkg
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ needs.verify.outputs.version }}
          tag_name: v${{ needs.verify.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/nupkg/*.nupkg
            artifacts/binaries/*.zip
